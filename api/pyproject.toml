[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ministry-of-herbology-api"
version = "1.0.0"
description = "The Ministry of Herbology API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "arq>=0.26",
    "python-multipart>=0.0.12",
    "icalendar>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "openapi-spec-validator>=0.7",
]

# One package per workstream, plus the shared app. Autodiscovery cannot guess
# a flat layout with this many top-level packages, so they are listed.
[tool.setuptools]
packages = ["app", "almanac", "grounds", "inventory", "tending"]

# 88, not 100: CI runs `black --check` from the repository root, where black
# finds no configuration and uses its own default, and the tree has been
# formatted at 88 since S0. The number matters less than the agreement (ADR 0018).
[tool.black]
line-length = 88

# Ruff stays at 100 on purpose. Black cannot split a long comment or string
# literal, so failing the lint on lines black itself will not fix helps nobody.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# The pytest configuration lives in the repository-root `pytest.ini`, and only
# there. It used to be here as well, which made `api/` the rootdir for any
# invocation confined to it — and because pytest's `confcutdir` follows the
# rootdir, the repository-root `conftest.py` that puts `workers` on `sys.path`
# was never loaded. `testpaths = ["tests"]` pointed at `api/tests`, which has
# never existed. See `pytest.ini` for the CI failure this caused.
