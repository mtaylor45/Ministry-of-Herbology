[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ministry-of-herbology-api"
version = "1.0.0"
description = "The Ministry of Herbology API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "arq>=0.26",
    "python-multipart>=0.0.12",
    "icalendar>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "openapi-spec-validator>=0.7",
]

# One package per workstream, plus the shared app. Autodiscovery cannot guess
# a flat layout with this many top-level packages, so they are listed.
[tool.setuptools]
packages = ["app", "almanac", "grounds", "inventory", "tending"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
