# Local development stack. Workstream B.
#
#   make dev      brings this up
#   make fixtures loads the fixture data
#
# With MOH_MOCK_MODE=true the API serves fixtures and needs no database, so a
# workstream can start before its dependencies exist (ADR 0003, rule 3).

name: herbology-dev

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: herbology
      POSTGRES_PASSWORD: herbology
      POSTGRES_DB: herbology
    ports: ['5432:5432']
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../../contracts/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U herbology']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ['1883:1883']
    command: ['mosquitto', '-c', '/mosquitto-no-auth.conf']

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      MOH_MOCK_MODE: ${MOH_MOCK_MODE:-true}
      MOH_DATABASE_URL: postgresql+asyncpg://herbology:herbology@db:5432/herbology
      MOH_REDIS_URL: redis://redis:6379/0
      MOH_PUBLIC_BASE_URL: http://localhost:8000
    ports: ['8000:8000']
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ../../api:/srv/api:ro
      - ../../contracts:/srv/contracts:ro
      - ../../fixtures:/srv/fixtures:ro
    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--reload']

  worker-weather:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      WORKER_MODULE: workers.weather.tasks
      MOH_DATABASE_URL: postgresql+asyncpg://herbology:herbology@db:5432/herbology
      MOH_REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ../../workers:/srv/workers:ro
      - ../../fixtures:/srv/fixtures:ro

  web:
    image: node:22-slim
    working_dir: /srv/web
    environment:
      MOH_API_URL: http://api:8000
    ports: ['5173:5173']
    volumes:
      - ../../web:/srv/web
    command: ['sh', '-c', 'npm install && npm run dev']
    depends_on: [api]

volumes:
  db-data:
