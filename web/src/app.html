<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ecd8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      /* Apply the stored theme before the first paint, so nobody standing in a
         dark greenhouse at 6am gets a flash of parchment. The key, the theme
         names and the colours match web/src/lib/ui/theme.ts; contrast.test.ts
         keeps the two in step. No stored choice means the device decides. */
      (function () {
        try {
          var stored = localStorage.getItem('moh-theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            stored === 'parchment' || stored === 'greenhouse'
              ? stored
              : dark
                ? 'greenhouse'
                : 'parchment';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme === 'greenhouse' ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'greenhouse' ? '#141a15' : '#f4ecd8');
        } catch (error) {
          /* storage blocked: the stylesheet's prefers-color-scheme rule covers it */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
