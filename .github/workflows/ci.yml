# CI. Workstream B owns this file.
#
# The contract job runs first and fast: if the frozen contract is broken, every
# other job's result is noise.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e './api[dev]'
      - name: Contract and schema tests
        run: pytest tests/contract -q

  ownership:
    name: Directory ownership
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: A workstream writes only inside its own paths
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          # A branch that does not name a workstream skips the check; the
          # script says so rather than failing.
          workstream=$(printf '%s' "$HEAD_REF" | sed -n 's|^ws-\([a-lA-L]\)/.*|\1|p')
          python scripts/check_ownership.py \
            --base "origin/$BASE_REF" \
            ${workstream:+--workstream "$workstream"}

  api:
    name: API and engines
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e './api[dev]'
      - name: Lint
        run: |
          ruff check api workers tests scripts
          black --check api workers tests scripts
      - name: Types
        run: mypy api/app workers || true  # advisory until S1 (ADR 0003)
      - name: Tests
        # tests/ is L's suite; api/ and workers/ hold each workstream's own
        # tests, which rule 2 requires them to keep inside their directory.
        # Collecting only tests/ meant those never ran in CI at all.
        run: pytest tests api workers -q

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: contract
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Sync SvelteKit
        run: npx svelte-kit sync
      - name: Lint and typecheck
        run: npm run lint
      - name: Unit tests, including the WCAG AA token checks
        run: npm run test
      - name: Build
        run: npm run build

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: herbology/api:${{ github.sha }}
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: herbology/web:${{ github.sha }}
      # Pushing to Harbor needs registry credentials; wired up in S1 by B.
